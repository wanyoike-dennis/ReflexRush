name: Android Verification

on:
  push:
    branches:
      - feature/reflex-rush-game
  pull_request:
    branches:
      - feature/reflex-rush-game
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests and APK builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and build debug and release APKs
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace
